<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/styles.css">
    <title>Update Voyage Details</title>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 class="page-title">Update Voyage Details</h1>
            <div class="ship-badge">{{ ship_name }}</div>
        </header>

        <div class="dashboard-content">
            <section class="voyage-update-section card">
                <form method="POST" class="form voyage-form">
                    <div class="form-group">
                        <label for="destination">Destination</label>
                        <input 
                            type="text" 
                            id="destination" 
                            name="destination" 
                            class="form-input"
                            placeholder="Enter destination port"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="eta">Estimated Time of Arrival</label>
                        <input 
                            type="date" 
                            id="eta" 
                            name="eta" 
                            class="form-input date-input"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Voyage Status</label>
                        <select 
                            id="status" 
                            name="status" 
                            class="form-select"
                            required
                        >
                            <option value="">Select status</option>
                            <option value="SCHEDULED">Scheduled</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="DELAYED">Delayed</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <a href="#" class="btn btn-secondary" onclick="history.back()">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Voyage</button>
                    </div>
                </form>
            </section>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
